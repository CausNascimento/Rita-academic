[project]
name = "rita-academic"
version = "0.1.0"
description = "Servidor MCP acadêmico pessoal: biblioteca local, fichamento com destaques de PDF, busca para escrita e transcrição de leituras gravadas."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=2.2,<3",
    "pymupdf>=1.24",
    "pyyaml>=6",
    "python-frontmatter>=1.1",
    "ebooklib>=0.18",
    "beautifulsoup4>=4.12",
    "faster-whisper>=1.1",
    "unidecode>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "anyio>=4", "ruff>=0.6"]

[project.scripts]
rita-academic = "rita_academic.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rita_academic"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
